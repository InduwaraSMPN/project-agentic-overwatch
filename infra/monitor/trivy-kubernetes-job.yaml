apiVersion: batch/v1
kind: Job
metadata:
  name: trivy-image-scan
  namespace: monitor
  labels:
    app.kubernetes.io/name: trivy-image-scan
    app.kubernetes.io/part-of: agentic-overwatch
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trivy-image-scan
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      initContainers:
        - name: trivy
          image: docker.io/aquasec/trivy:TRIVY_IMAGE_VERSION
          imagePullPolicy: IfNotPresent
          env:
            # The scan subject is explicit and immutable; this Job is not a broad cluster scanner.
            - name: TARGET_IMAGE
              value: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/frontend@sha256:c06df08eccd78568a37292cfbe889df42fac48691b7fb05f2deeba0ae8d669ef
          args:
            - image
            - --format
            - json
            - --output
            - /work/trivy.json
            - $(TARGET_IMAGE)
          volumeMounts:
            - name: report
              mountPath: /work
      containers:
        - name: uploader
          image: agentic-overwatch/evidence-aggregator:local
          imagePullPolicy: Never
          command: ["python", "-m", "monitor.trivy_uploader"]
          env:
            - name: MONITOR_TRIVY_REPORT
              value: /work/trivy.json
            - name: MONITOR_TRIVY_URL
              value: http://evidence-aggregator.monitor.svc.cluster.local:8080/v1/trivy
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: report
              mountPath: /work
              readOnly: true
      volumes:
        - name: report
          emptyDir: {}
