# infra/boutique/images.yaml -- the digest pins for every container image Online Boutique runs in
# this cluster. This is the file infra/versions.env's BOUTIQUE_IMAGE_DIGESTS_FILE names.
#
# A TAG IS NOT A PIN
#   The upstream base references its images by the tag v0.10.6, and a registry tag is a mutable
#   pointer: nothing prevents the same tag resolving to different bytes next month, and nothing in a
#   sealed run bundle would record that it had. NFR1's clean-machine reproducibility and the
#   provenance row T-15 both rest on the claim that two runs weeks apart executed the same software.
#   A digest is the only reference that makes that claim checkable, because it is the content hash
#   of the image manifest itself: name@sha256:... either resolves to those exact bytes or fails to
#   resolve at all.
#
# HOW THESE DIGESTS WERE OBTAINED
#   Each is the Docker-Content-Digest header returned by a registry v2 manifest request for the
#   service's v0.10.6 tag -- that is, the registry's own answer to "what does this tag point at",
#   not a value computed or copied from anywhere else. The Boutique images are published as
#   single-platform linux/amd64 manifests, which is what kind's node containers run on this
#   project's WSL2 host; a host of a different architecture would need these resolved again, and
#   that would be a stack change rather than a re-pin. The redis digest is a multi-platform index
#   digest and is architecture independent.
#
#   To re-resolve one by hand, without pulling the image, send a HEAD request for the tag's manifest
#   to the registry and read the Docker-Content-Digest header back:
#     us-central1-docker.pkg.dev/v2/online-boutique-ci/microservices-demo/frontend/manifests/v0.10.6
#   with an Accept header of application/vnd.docker.distribution.manifest.v2+json. The registry
#   serves these anonymously; no credential is needed and none belongs in this repository.
#
# WHY BUILTIN TRANSFORMER DOCUMENTS AND NOT AN images: LIST
#   Kustomize's images: field lives inside a kustomization.yaml or a Component, and a Component is a
#   directory rather than a file -- so neither could be the file named images.yaml that
#   BOUTIQUE_IMAGE_DIGESTS_FILE has to point at. The transformers: field does accept a plain YAML
#   path, and the transformer it accepts for this job is the builtin ImageTagTransformer. That
#   plugin takes a single imageTag mapping and has no plural form -- verified against the plugin's
#   own definition for the Kustomize in play (kubectl v1.36.1 embeds Kustomize v5.8.1), not assumed
#   -- so each image is its own YAML document with its own metadata.name. The repetition is the
#   price of the file being a file.
#
# newName REPEATS name ON EVERY ENTRY, DELIBERATELY
#   Kustomize would accept name plus digest alone and leave the repository path untouched. Writing
#   newName out anyway makes each entry state the complete reference that will be deployed instead
#   of half of it, so a reader checking what actually runs reads one line rather than reconstructing
#   it from the upstream base. It also means a future registry move -- upstream has changed the
#   project segment of these paths before -- is one edit per entry in one file.
#
# WHAT IS DELIBERATELY ABSENT
#   loadgenerator. It is the one image the upstream base builds that this overlay does not run:
#   remove-loadgenerator.yaml deletes the Deployment, for the reasons that file gives. Pinning an
#   image for a workload the sibling file deletes would put a contradiction inside one directory,
#   and a reader would be right to wonder which of the two is current. The absence is the assertion.
#
#   busybox, the init container of that same loadgenerator Deployment, is absent for the same reason
#   -- and it is worth noting that upstream already pins it by digest, so the practice here is
#   upstream's own rather than a local invention.
#
# WHAT BREAKS IF THIS FILE CHANGES
#   Editing a digest without a matching entry in the decisions log makes every previously sealed
#   bundle's versions digest describe a stack that is no longer deployed, and nothing detects it:
#   runs keep completing. Removing the file makes the application a moving target. Adding an entry
#   whose name matches nothing in the base is a silent no-op -- Kustomize does not fail on an
#   unmatched image -- so a typo here is caught only by the M1 verification step that asserts every
#   running pod's image is a digest reference.
#
# RE-PINNING PROCEDURE, because doing this by halves is the failure mode
#   Bump ?ref= in kustomization.yaml, BOUTIQUE_MANIFEST_REF in infra/versions.env and every digest
#   below in one commit. The first two are held together by a test; the digests are not, because
#   nothing offline can tell a stale digest from a current one. Re-resolve them all rather than the
#   ones that look like they changed.

apiVersion: builtin
kind: ImageTagTransformer
metadata:
  name: pin-adservice
imageTag:
  name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/adservice
  newName: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/adservice
  digest: sha256:f580c4853e896dd2083f0c270c4b7aa5feda6dd56058a93b87d0c88334a4c07d

