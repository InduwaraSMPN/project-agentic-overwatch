# redis-cart, the cart service's backing store. It is the one image in the base referenced by a
# floating upstream tag -- redis:alpine, which moves with every Redis release -- so it is also the
# one entry here whose pin genuinely changes what runs rather than merely recording it. The digest
# below is what redis:alpine resolved to when this file was written; the image behind it reports
# REDIS_VERSION=8.10.1. This is a multi-platform index digest, so it is valid on any node
# architecture.
apiVersion: builtin
kind: ImageTagTransformer
metadata:
  name: pin-redis
imageTag:
  name: redis
  newName: redis
  digest: sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
