# Templated from infra/netpol/agents-default-deny.yaml's ServiceAccount object: the namespace's
# `default` ServiceAccount with token automounting turned off. Defence in depth -- the primary
# control is that no Role/ClusterRole in this project binds any subject in `agents` to
# anything (guardian/deploy/rbac.yaml's Tier B assertion (2)).
#
# GUARDED BY agents.manageDefaultServiceAccount (default true). Kubernetes auto-creates a
# `default` ServiceAccount in every namespace, so on a FRESH install Helm's server-side apply
# adopts it; but on a re-install into a namespace left behind by a prior (failed or uninstalled)
# release, that auto-created SA carries no Helm ownership metadata and Helm refuses it with
# "ServiceAccount \"default\" ... exists and cannot be imported into the current release." Set
# this value false to have the chart NOT manage the `default` SA (the collision then cannot
# happen); the automount-off hardening is then a one-line manual step the operator runs instead,
# documented in docs/ops/runbook.md section 5.6:
#   kubectl -n <agents-ns> patch serviceaccount default -p '{"automountServiceAccountToken":false}'
{{- if .Values.agents.manageDefaultServiceAccount }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: {{ .Values.namespaces.agents }}
  labels:
    {{- include "agentic-overwatch.chartLabels" . | nindent 4 }}
    app.kubernetes.io/component: agents
automountServiceAccountToken: false
{{- end }}
