description: One grouped webhook body captured byte-for-byte off the wire from the live Alertmanager in namespace observability, carrying two firing KubeDeploymentReplicasMismatch alerts at severity critical for the boutique namespace. The alerts are real -- Prometheus evaluated the rule in infra/observability/prometheus-values.yaml against kube-state-metrics series for two deployments whose available replica count had genuinely fallen below their specified count. The body therefore carries the label and annotation set Alertmanager actually assembles, including the kube-state-metrics label surface (container, endpoint, instance, job, pod, service, uid) that the synthesised webhook fixture does not model, real fingerprints, a real groupKey and a real generatorURL. The caps are the tightest of the four captured fixtures so that a real alert body is observed being capped.
