description: Environment-controlled text carrying every injection shape quoting.py defends against, in the fields an attacker can actually set -- a container name, a process command line, an OIDC username, a user agent and an RBAC annotation. Covers a frame-break attempt that closes the quoted region and writes a fake operator instruction before reopening it, a right-to-left override, ANSI escape introducers, NUL and BEL, a zero-width space, a zero-width no-break space, a line separator, tag characters that mirror ASCII while rendering as nothing, and a literal backslash. Its caps are the loosest in the corpus on purpose, so that every shape survives into the golden output rather than being truncated away before quoting ever sees it.
