description: Six JSON alert lines read byte-for-byte from the stdout of the live Falco DaemonSet in namespace monitor on the kind cluster, two from each of the three rules that fired during the capture window -- Read sensitive file untrusted at priority Error, Terminal shell in container at priority Warning, and Unexpected outbound connection destination at priority Notice. Unlike the synthesised falco fixture beside it these bytes carry the field shapes a real emitter produces rather than the ones the documentation describes -- JSON null rather than the string placeholder for absent k8s fields, an empty string for an unresolved proc.exepath, the sentinel user.uid 4294967295 for an unmapped user, and container.id host for a host-context event. Records are ordered by their emitted time field. The caps are mid-range for the corpus so that real Falco output lengths are observed being capped rather than passing through untouched.
